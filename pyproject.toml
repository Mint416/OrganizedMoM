[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "organized-mom"
version = "0.1.0"
description = "A source-grounded family assistant with six specialist roles and human-controlled actions."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "scikit-learn>=1.6,<2", "mcp>=1.12,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
google = ["google-api-python-client>=2,<3", "google-auth-oauthlib>=1,<2"]
dev = ["ruff>=0.12,<1", "playwright>=1.50,<2"]
artifacts = ["pillow>=11,<13", "imageio-ffmpeg>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["organized_mom*"]

[tool.ruff]
line-length = 110
target-version = "py311"
